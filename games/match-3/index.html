<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2a1d4e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 홈 화면에 설치될 앱 이름 (게임 화면 제목과 별개로 앱 전체 이름) -->
  <meta name="application-name" content="엄마 게임천국">
  <meta name="apple-mobile-web-app-title" content="엄마 게임천국">
  <title>보석 맞추기</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png?v=32">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png?v=32">
  <link rel="stylesheet" href="style.css?v=32">
</head>
<body>
  <!-- 보석 그림 (직접 그린 SVG, 색마다 모양도 달라 색을 구별하기 어려워도 알아볼 수 있게) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="g0" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffb3b3"/><stop offset=".45" stop-color="#ef4444"/><stop offset="1" stop-color="#991b1b"/></radialGradient>
      <radialGradient id="g1" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffe0b0"/><stop offset=".45" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></radialGradient>
      <radialGradient id="g2" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fffbd0"/><stop offset=".45" stop-color="#facc15"/><stop offset="1" stop-color="#a16207"/></radialGradient>
      <radialGradient id="g3" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ccffd6"/><stop offset=".45" stop-color="#22c55e"/><stop offset="1" stop-color="#166534"/></radialGradient>
      <radialGradient id="g4" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#cfe6ff"/><stop offset=".45" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e3a8a"/></radialGradient>
      <radialGradient id="g5" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#f0d6ff"/><stop offset=".45" stop-color="#a855f7"/><stop offset="1" stop-color="#6b21a8"/></radialGradient>
      <linearGradient id="grain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5d5d"/><stop offset=".2" stop-color="#ffb13b"/><stop offset=".4" stop-color="#ffe84a"/><stop offset=".6" stop-color="#4ade80"/><stop offset=".8" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
      <!-- 빨강: 둥근 보석 -->
      <symbol id="gem0" viewBox="0 0 100 100"><circle cx="50" cy="52" r="38" fill="url(#g0)" stroke="#7f1d1d" stroke-width="3"/><path d="M50 22 L70 40 L50 52 L30 40 Z" fill="#fff" opacity=".22"/><ellipse cx="38" cy="34" rx="10" ry="6" fill="#fff" opacity=".7" transform="rotate(-30 38 34)"/></symbol>
      <!-- 주황: 네모 -->
      <symbol id="gem1" viewBox="0 0 100 100"><rect x="16" y="17" width="68" height="68" rx="14" fill="url(#g1)" stroke="#78350f" stroke-width="3"/><rect x="30" y="31" width="40" height="40" rx="8" fill="#fff" opacity=".18"/><ellipse cx="33" cy="31" rx="9" ry="5" fill="#fff" opacity=".7" transform="rotate(-30 33 31)"/></symbol>
      <!-- 노랑: 별 -->
      <symbol id="gem2" viewBox="0 0 100 100"><path d="M50 10 L61 38 L91 39 L67 58 L76 88 L50 70 L24 88 L33 58 L9 39 L39 38 Z" fill="url(#g2)" stroke="#854d0e" stroke-width="3" stroke-linejoin="round"/><ellipse cx="42" cy="38" rx="7" ry="4" fill="#fff" opacity=".75" transform="rotate(-30 42 38)"/></symbol>
      <!-- 초록: 물방울 -->
      <symbol id="gem3" viewBox="0 0 100 100"><path d="M50 10 C66 32 82 48 82 64 A32 32 0 0 1 18 64 C18 48 34 32 50 10 Z" fill="url(#g3)" stroke="#14532d" stroke-width="3"/><ellipse cx="38" cy="54" rx="8" ry="5" fill="#fff" opacity=".7" transform="rotate(-50 38 54)"/></symbol>
      <!-- 파랑: 다이아몬드 -->
      <symbol id="gem4" viewBox="0 0 100 100"><path d="M50 8 L90 50 L50 92 L10 50 Z" fill="url(#g4)" stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round"/><path d="M50 8 L50 92 M10 50 L90 50" stroke="#fff" stroke-width="2" opacity=".25"/><ellipse cx="36" cy="36" rx="8" ry="4" fill="#fff" opacity=".7" transform="rotate(-45 36 36)"/></symbol>
      <!-- 보라: 육각형 -->
      <symbol id="gem5" viewBox="0 0 100 100"><path d="M50 11 L84 30 L84 70 L50 89 L16 70 L16 30 Z" fill="url(#g5)" stroke="#581c87" stroke-width="3" stroke-linejoin="round"/><path d="M50 30 L67 40 L67 60 L50 70 L33 60 L33 40 Z" fill="#fff" opacity=".18"/><ellipse cx="35" cy="34" rx="8" ry="4" fill="#fff" opacity=".7" transform="rotate(-30 35 34)"/></symbol>
      <!-- 무지개 보석 -->
      <symbol id="gemR" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="url(#grain)" stroke="#fff" stroke-width="4"/><circle cx="50" cy="50" r="16" fill="#fff" opacity=".85"/><circle cx="50" cy="50" r="9" fill="url(#grain)"/><ellipse cx="34" cy="30" rx="9" ry="5" fill="#fff" opacity=".8" transform="rotate(-30 34 30)"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- 첫 화면 -->
    <section id="home" class="screen">
      <button id="btn-hub" class="hub-back">← 게임 목록</button>
      <div class="home-inner">
        <div class="logo" id="logo"></div>
        <h1>보석 맞추기</h1>
        <p class="sub">같은 보석 3개를 한 줄로 맞춰요</p>
        <button id="btn-continue" class="btn big">이어하기<small id="continue-info"></small></button>
        <button id="btn-play" class="btn big">스테이지 1 시작</button>
        <!-- 스테이지 고르기: 번호 + 별, 잠긴 곳은 자물쇠 -->
        <div id="stage-grid" class="stage-grid" aria-label="스테이지 고르기"></div>
        <p id="record" class="record"></p>
        <button id="btn-sound-home" class="btn light small">🔊 소리 켜짐</button>
        <p class="howto">보석을 옆으로 밀어 자리를 바꿔요.<br>목표를 채우면 성공! 남은 횟수는 보너스가 돼요.<br>4개·5개를 맞추면 특별한 보석이 생겨요!<br>특별한 보석은 두 번 누르면 바로 터져요.</p>
        <p id="app-version" class="version"></p>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="game" class="screen hidden">
      <header class="topbar">
        <button id="btn-home" class="icon-btn" aria-label="보석 맞추기 메뉴">🏠</button>
        <div class="stat"><span class="label" id="stage-label">스테이지 1</span><span id="score" class="value">0</span></div>
        <div class="stat moves"><span class="label">남은 횟수</span><span id="moves" class="value">20</span></div>
        <button id="btn-sound" class="icon-btn" aria-label="소리">🔊</button>
      </header>
      <!-- 목표: 남은 개수, 다 채우면 ✓ -->
      <div id="goals" class="goals" aria-label="목표"></div>
      <div id="stage">
        <div id="board" aria-label="보석 판"></div>
        <div id="combo" class="hidden"></div>
        <div id="banner" class="hidden"></div>
      </div>
      <!-- 별 게이지: 클리어하면 ★1, 점수가 기준을 넘으면 ★2·★3 -->
      <div class="bottom">
        <div id="gauge-stars" class="gauge-stars" aria-label="받을 별"></div>
        <div id="gauge" class="gauge"><div id="gauge-fill" class="fill"></div><span class="mk m2"><b>★★</b><small></small></span><span class="mk m3"><b>★★★</b><small></small></span></div>
      </div>
    </section>

    <div id="overlay" class="hidden">
      <div class="modal">
        <div class="modal-emoji"></div>
        <h2 class="modal-title"></h2>
        <div class="modal-body"></div>
        <div class="modal-btns"></div>
      </div>
    </div>
    <div id="toast" class="hidden"></div>
  </div>
  <script src="../../wallet.js?v=32"></script>
  <script src="logic.js?v=32"></script>
  <script src="stages.js?v=32"></script>
  <script src="game.js?v=32"></script>
</body>
</html>
