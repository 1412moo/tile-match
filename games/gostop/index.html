<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f5e46">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 홈 화면에 설치될 앱 이름 (게임 화면 제목과 별개로 앱 전체 이름) -->
  <meta name="application-name" content="엄마 게임천국">
  <meta name="apple-mobile-web-app-title" content="엄마 게임천국">
  <title>고스톱</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png?v=18">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png?v=18">
  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
  <div id="app">
    <!-- 고스톱 첫 화면 -->
    <section id="home" class="screen">
      <button id="btn-hub" class="hub-back">← 게임 목록</button>
      <div class="home-inner">
        <div class="logo" id="logo"></div>
        <h1>고스톱</h1>
        <p class="sub">컴퓨터와 둘이 치는 맞고</p>
        <button id="btn-continue" class="btn big">이어하기</button>
        <button id="btn-new" class="btn light">새 판 시작</button>
        <button id="btn-rules" class="btn light">규칙 보기</button>
        <p id="record" class="record"></p>
        <button id="btn-sound-home" class="btn light small">🔊 소리 켜짐</button>
        <p id="app-version" class="version"></p>
        <p class="credit">화투 그림: Louie Mantia, Jr. · Marcus Richert · Spenĉjo (Wikimedia Commons),
          <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ko" target="_blank" rel="noopener">CC BY-SA 4.0</a></p>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="game" class="screen hidden">
      <header class="topbar">
        <button id="btn-home" class="icon-btn" aria-label="고스톱 메뉴">🏠</button>
        <div class="title">고스톱 <span id="round-mult" class="mult hidden"></span></div>
        <button id="btn-sound" class="icon-btn" aria-label="소리">🔊</button>
      </header>

      <div class="side opp" id="opp-side">
        <div class="info">
          <div class="who">🤖 컴퓨터</div>
          <div class="backs" id="opp-hand"></div>
          <div class="badges" id="opp-badges"></div>
          <div class="pts" id="opp-pts">0점</div>
        </div>
        <div class="piles" id="opp-piles"></div>
      </div>

      <div id="table">
        <div id="deck" aria-label="더미"><div class="hw back"></div><span id="deck-count"></span></div>
        <div id="floor"></div>
        <div id="flip-show" class="hidden"></div>
      </div>

      <div class="side me" id="me-side">
        <div class="piles" id="my-piles"></div>
        <div class="info">
          <div class="who">😊 나</div>
          <div class="rec" id="my-record" aria-label="내 전적"></div>
          <div class="badges" id="my-badges"></div>
          <div class="pts" id="my-pts">0점</div>
        </div>
      </div>
      <div id="msg"></div>
      <div id="hand"></div>
    </section>

    <div id="event" class="hidden"></div>
    <div id="overlay" class="hidden">
      <div class="modal">
        <div class="modal-emoji"></div>
        <h2 class="modal-title"></h2>
        <div class="modal-body"></div>
        <div class="modal-btns"></div>
      </div>
    </div>
    <div id="toast" class="hidden"></div>
  </div>
  <script src="rules.js?v=18"></script>
  <script src="art.js?v=18"></script>
  <script src="fx.js?v=18"></script>
  <script src="game.js?v=18"></script>
</body>
</html>
