<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff1d6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 홈 화면에 설치될 앱 이름 (게임 화면 제목과 별개로 앱 전체 이름) -->
  <meta name="application-name" content="엄마 게임천국">
  <meta name="apple-mobile-web-app-title" content="엄마 게임천국">
  <title>수박게임</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png?v=29">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png?v=29">
  <link rel="stylesheet" href="style.css?v=29">
</head>
<body>
  <div id="app">
    <!-- 수박게임 첫 화면 -->
    <section id="home" class="screen">
      <button id="btn-hub" class="hub-back">← 게임 목록</button>
      <div class="home-inner">
        <div class="logo" id="logo"></div>
        <h1>수박게임</h1>
        <p class="sub">같은 과일끼리 합쳐서 수박을 만들어요</p>
        <button id="btn-continue" class="btn big">이어하기<small id="continue-info"></small></button>
        <button id="btn-new" class="btn light">새 게임</button>
        <p id="record" class="record"></p>
        <button id="btn-sound-home" class="btn light small">🔊 소리 켜짐</button>
        <p class="howto">좌우로 움직이고 손을 떼면 과일이 떨어져요.<br>과일이 위쪽 선을 넘어 3초 넘게 쌓이면 끝나요.</p>
        <p id="app-version" class="version"></p>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="game" class="screen hidden">
      <header class="topbar">
        <button id="btn-home" class="icon-btn" aria-label="수박게임 메뉴">🏠</button>
        <div class="scorebox">
          <div id="score" class="score">0</div>
          <div id="best" class="best">최고 0</div>
        </div>
        <div class="nextbox" aria-label="다음 과일"><span>다음</span><div id="next"></div></div>
        <button id="btn-sound" class="icon-btn" aria-label="소리">🔊</button>
      </header>
      <div id="stage"><canvas id="cv"></canvas></div>
      <div id="legend" class="legend" aria-label="과일 순서"></div>
    </section>

    <div id="overlay" class="hidden">
      <div class="modal">
        <div class="modal-emoji"></div>
        <h2 class="modal-title"></h2>
        <div class="modal-body"></div>
        <div class="modal-btns"></div>
      </div>
    </div>
    <div id="toast" class="hidden"></div>
  </div>
  <script src="../../wallet.js?v=29"></script>
  <script src="physics.js?v=29"></script>
  <script src="core.js?v=29"></script>
  <script src="art.js?v=29"></script>
  <script src="game.js?v=29"></script>
</body>
</html>
