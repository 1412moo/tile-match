<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f5e46">
  <title>틀린그림찾기 샘플 - 거실</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #1f5e46; color: #fff; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    #app { position: fixed; inset: 0; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
      background: radial-gradient(ellipse at 50% 30%, #3f9b72, #1f5e46 75%);
      padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom); }
    .bar { display: flex; align-items: center; gap: 8px; padding: 8px 2px 4px; }
    .bar .title { flex: 1; font-size: 20px; font-weight: 800; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .count { font-size: 20px; font-weight: 900; background: rgba(0,0,0,.25); border-radius: 12px; padding: 4px 12px; }
    .btn { min-height: 44px; padding: 0 14px; border: none; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 800;
      color: #2d2a26; background: rgba(255,255,255,.92); box-shadow: 0 4px 0 rgba(0,0,0,.2); }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
    .pics { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    .pic { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden;
      box-shadow: 0 0 0 3px #fff, 0 6px 14px rgba(0,0,0,.35); background: #fff; }
    .pic > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .tag { position: absolute; left: 6px; top: 6px; z-index: 3; font-size: 12px; font-weight: 800; padding: 1px 7px;
      border-radius: 8px; background: rgba(0,0,0,.45); color: #fff; pointer-events: none; }
    .mark { position: absolute; z-index: 4; pointer-events: none; border: 4px solid #e8262e; border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,.85); animation: pop .35s ease-out; }
    .mark.hint { border-color: #ffd23f; border-style: dashed; animation: pulse .9s ease-in-out infinite; }
    .mark.answer { border-color: #3da5ff; border-style: dotted; }
    .miss { position: absolute; z-index: 4; pointer-events: none; font-size: 26px; font-weight: 900; color: #e8262e;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff; transform: translate(-50%, -50%); animation: fade .7s ease-out forwards; }
    @keyframes pop { from { transform: scale(1.6); opacity: 0; } }
    @keyframes pulse { 50% { transform: scale(1.12); } }
    @keyframes fade { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
    .foot { display: flex; gap: 8px; justify-content: center; padding: 6px 0 4px; }
    .credit { text-align: center; font-size: 11px; opacity: .65; padding-bottom: 6px; }
    .credit a { color: inherit; }
    #done { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); }
    #done div { background: #fff; color: #2d2a26; border-radius: 22px; padding: 22px 26px; text-align: center; font-size: 22px; font-weight: 800; }
  </style>
</head>
<body>
  <div id="app">
    <div class="bar">
      <div class="title">🔍 거실 (샘플)</div>
      <div class="count"><span id="found">0</span> / <span id="total">5</span></div>
    </div>
    <div class="pics">
      <div class="pic" id="picA"><span class="tag">원래 그림</span></div>
      <div class="pic" id="picB"><span class="tag">다른 그림</span></div>
    </div>
    <div class="foot">
      <button class="btn" id="btn-hint">💡 힌트</button>
      <button class="btn" id="btn-answer">정답 보기</button>
      <button class="btn" id="btn-reset">처음부터</button>
    </div>
    <div class="credit">그림 일부: <a href="https://github.com/jdecked/twemoji" target="_blank" rel="noopener">Twemoji</a>
      (<a href="https://creativecommons.org/licenses/by/4.0/deed.ko" target="_blank" rel="noopener">CC BY 4.0</a>)</div>
  </div>
  <div id="done"><div>🎉 모두 찾았어요!</div></div>

<script>
(async function () {
  'use strict';
  const VW = 400, VH = 300; // 장면 좌표계 (4:3)

  // ---------- Twemoji SVG 불러오기 ----------
  const EMOJI = {
    sofa: '1f6cb', frame: '1f5bc', clock: '1f570', bear: '1f9f8', tv: '1f4fa', plant: '1fab4', cat: '1f408',
    yarn: '1f9f6', coffee: '2615', apple: '1f34e', orange: '1f34a', banana: '1f34c', books: '1f4da',
    tulip: '1f337', sun: '2600', bird: '1f426', candle: '1f56f', vase: '1f3fa', book: '1f4d6',
  };
  const src = {};
  await Promise.all(Object.entries(EMOJI).map(async ([k, cp]) => {
    src[k] = await (await fetch(`emoji/${cp}.svg`)).text();
  }));

  // 색 바꾸기: SVG 안의 모든 fill 색의 색상(hue)을 돌린다
  function hueShift(svg, deg) {
    return svg.replace(/#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b/g, (m, h) => {
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      let r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
      let hh = 0, s = 0;
      if (mx !== mn) {
        const d = mx - mn;
        s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
        hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
        hh *= 60;
      }
      if (s < 0.15) return m; // 회색·흰색·검정은 그대로
      hh = (hh + deg) % 360;
      const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((hh / 60) % 2 - 1)), mm = l - c / 2;
      const [r1, g1, b1] = hh < 60 ? [c, x, 0] : hh < 120 ? [x, c, 0] : hh < 180 ? [0, c, x] : hh < 240 ? [0, x, c] : hh < 300 ? [x, 0, c] : [c, 0, x];
      return '#' + [r1, g1, b1].map(v => Math.round((v + mm) * 255).toString(16).padStart(2, '0')).join('');
    });
  }
  // 이모지를 장면 안 (x, y, size) 에 넣기. flip: 좌우 반전, hue: 색 바꾸기
  function emoji(key, x, y, size, opt = {}) {
    let s = src[key];
    if (opt.hue) s = hueShift(s, opt.hue);
    const inner = s.replace(/^<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
    const box = `<svg x="0" y="0" width="${size}" height="${size}" viewBox="0 0 36 36">${inner}</svg>`;
    const t = opt.flip ? `translate(${x + size} ${y}) scale(-1 1)` : `translate(${x} ${y})`;
    return `<g transform="${t}">${box}</g>`;
  }

  // ---------- 직접 그린 배경 ----------
  function background(v) {
    let s = '';
    s += `<defs><linearGradient id="sky${v}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd3ff"/><stop offset="1" stop-color="#e3f3ff"/></linearGradient>` +
      `<pattern id="paper${v}" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#f3e3c7"/>` +
      `<path d="M11 4 l2 3 l-2 3 l-2 -3 Z" fill="#ead3ad"/><rect x="0" y="0" width="1.2" height="22" fill="#eedbb9"/></pattern>` +
      `<pattern id="plank${v}" width="80" height="16" patternUnits="userSpaceOnUse"><rect width="80" height="16" fill="#bd8753"/>` +
      `<rect y="15" width="80" height="1.2" fill="#9c6a3a"/><rect x="52" width="1.2" height="16" fill="#a8733f"/><path d="M8 6 q10 -3 20 0" stroke="#b27b46" stroke-width="1" fill="none"/></pattern></defs>`;
    s += `<rect width="${VW}" height="${VH}" fill="url(#paper${v})"/>`;                            // 벽지
    s += `<rect y="206" width="${VW}" height="${VH - 206}" fill="url(#plank${v})"/>`;               // 마루
    s += `<rect y="198" width="${VW}" height="9" fill="#fbf4e6"/><rect y="206" width="${VW}" height="2" fill="#d9c7a8"/>`; // 걸레받이
    // 창문
    s += `<rect x="28" y="34" width="104" height="104" rx="3" fill="#fbf7f0" stroke="#d6c7ad" stroke-width="2"/>` +
      `<rect x="36" y="42" width="88" height="88" fill="url(#sky${v})"/>` +
      `<path d="M36 108 q22 -14 44 0 t44 0 V130 H36 Z" fill="#9ccf8a"/><path d="M36 118 q30 -10 60 2 t28 -2 V130 H36 Z" fill="#7fbf70"/>` +
      `<rect x="78" y="42" width="4" height="88" fill="#fbf7f0"/><rect x="36" y="84" width="88" height="4" fill="#fbf7f0"/>` +
      `<rect x="24" y="136" width="112" height="7" rx="2" fill="#efe4d0"/>`;
    return s;
  }
  function curtains(color) {
    return `<rect x="16" y="26" width="128" height="5" rx="2" fill="#8a5a2a"/>` +
      `<path d="M18 30 C30 70 20 110 34 150 L18 150 Z" fill="${color}"/><path d="M142 30 C130 70 140 110 126 150 L142 150 Z" fill="${color}"/>` +
      `<path d="M22 30 q4 40 0 120 M136 30 q-4 40 0 120" stroke="rgba(0,0,0,.12)" stroke-width="3" fill="none"/>` +
      `<rect x="16" y="104" width="16" height="5" rx="2" fill="#e9b44c"/><rect x="128" y="104" width="16" height="5" rx="2" fill="#e9b44c"/>`;
  }
  const lamp = () => `<path d="M236 0 V44" stroke="#5a4632" stroke-width="2"/><path d="M220 44 H252 L262 66 H210 Z" fill="#f1c35a" stroke="#c99a32" stroke-width="1.5"/>` +
    `<ellipse cx="236" cy="66" rx="26" ry="4" fill="#e3ad3e"/><circle cx="236" cy="70" r="4" fill="#fff6c9"/>`;
  const shelf = () => `<rect x="268" y="96" width="118" height="7" rx="2" fill="#9b6a3a"/><path d="M280 103 v10 l8 -10 M372 103 v10 l-8 -10" stroke="#7d5229" stroke-width="3" fill="none"/>`;
  const cabinet = () => `<rect x="272" y="168" width="116" height="46" rx="3" fill="#a8743f" stroke="#7d5229" stroke-width="2"/>` +
    `<rect x="279" y="175" width="49" height="32" rx="2" fill="#b98552"/><rect x="332" y="175" width="49" height="32" rx="2" fill="#b98552"/>` +
    `<circle cx="324" cy="191" r="2" fill="#6b4523"/><circle cx="336" cy="191" r="2" fill="#6b4523"/>` +
    `<rect x="276" y="214" width="6" height="8" fill="#7d5229"/><rect x="378" y="214" width="6" height="8" fill="#7d5229"/>`;
  const rug = () => `<ellipse cx="206" cy="262" rx="150" ry="30" fill="#6f8f72"/><ellipse cx="206" cy="262" rx="138" ry="24" fill="none" stroke="#e8dcc0" stroke-width="3" stroke-dasharray="6 5"/>` +
    `<ellipse cx="206" cy="262" rx="112" ry="17" fill="#7fa283"/>`;
  const table = () => `<rect x="186" y="244" width="6" height="22" fill="#6b4523"/><rect x="298" y="244" width="6" height="22" fill="#6b4523"/>` +
    `<rect x="176" y="236" width="138" height="11" rx="4" fill="#8a5a2a"/><rect x="176" y="236" width="138" height="4" rx="2" fill="#a8743f"/>`;
  const bowl = () => `<path d="M246 228 q18 14 36 0 Z" fill="#ffffff" stroke="#c9d4dc" stroke-width="1.5"/>`;
  const cushion = color => `<rect x="54" y="176" width="30" height="24" rx="7" fill="${color}" transform="rotate(-12 69 188)"/>` +
    `<path d="M58 188 h22" stroke="rgba(255,255,255,.45)" stroke-width="2" transform="rotate(-12 69 188)"/>`;

  // ---------- 장면 (diff = 적용할 차이 이름 목록) ----------
  function scene(v, diff) {
    const has = k => diff.includes(k);
    let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMid slice">`;
    s += background(v);
    if (!has('sun')) s += emoji('sun', 100, 50, 22);                      // 창밖 해 (없어짐)
    s += curtains('#c8434b');
    s += emoji('frame', 158, 70, 58);                                     // 액자
    s += lamp();
    s += shelf();
    s += emoji('books', 272, 64, 34);                                     // 선반: 책
    s += emoji('clock', 310, 60, 38, { flip: has('clock') });            // 선반: 시계 (좌우 반전 → 바늘 방향)
    s += emoji('tulip', 352, 60, 36, { hue: has('tulip') ? -45 : 0 });   // 선반: 튤립 (분홍 → 연보라)
    s += rug();
    s += emoji('sofa', 8, 118, 150);                                      // 소파(스탠드 포함)
    s += cushion(has('cushion') ? '#e98b3a' : '#d9534f');                 // 쿠션 (빨강 → 주황)
    s += emoji('bear', 94, 162, 40);                                      // 곰인형
    s += emoji('plant', 150, 150, 62);                                    // 화분
    s += cabinet();
    s += emoji('tv', 296, 110, 66);                                       // TV
    s += emoji('candle', 360, 146, 24);                                   // 초
    s += table();
    s += emoji('coffee', 186, 208, 30);                                   // 커피
    s += emoji('book', 214, 216, 26);                                     // 펼친 책
    s += bowl();
    s += emoji('apple', 244, 208, 22);
    s += emoji('orange', 258, 206, 22);
    if (!has('banana')) s += emoji('banana', 266, 212, 20);              // 바나나 (없어짐)
    s += emoji('cat', 36, 238, 54);                                       // 고양이
    s += emoji('yarn', 102, 262, 26);                                     // 털실
    return s + '</svg>';
  }

  // 차이 목록: 장면 좌표 기준 영역 (터치 판정·동그라미 위치)
  const DIFFS = [
    { key: 'cushion', x: 50, y: 168, w: 40, h: 38, desc: '소파 쿠션 색' },
    { key: 'banana', x: 262, y: 206, w: 28, h: 26, desc: '과일 그릇의 바나나' },
    { key: 'sun', x: 98, y: 48, w: 26, h: 26, desc: '창밖의 해' },
    { key: 'clock', x: 310, y: 60, w: 38, h: 38, desc: '시계 바늘 방향' },
    { key: 'tulip', x: 352, y: 58, w: 36, h: 40, desc: '튤립 색' },
  ];

  const picA = document.getElementById('picA'), picB = document.getElementById('picB');
  picA.insertAdjacentHTML('beforeend', scene('a', []));
  picB.insertAdjacentHTML('beforeend', scene('b', DIFFS.map(d => d.key)));
  document.getElementById('total').textContent = DIFFS.length;

  // ---------- 간단한 터치 판정 (샘플용) ----------
  const found = new Set();
  const PAD = 10; // 장면 좌표 기준 여유
  const MIN_PX = 44; // 화면 기준 최소 터치 크기
  function scaleOf(pic) { const r = pic.getBoundingClientRect(); return Math.max(r.width / VW, r.height / VH); }
  function toScene(pic, cx, cy) { // preserveAspectRatio slice 기준 변환
    const r = pic.getBoundingClientRect(), k = scaleOf(pic);
    const ox = (r.width - VW * k) / 2, oy = (r.height - VH * k) / 2;
    return [(cx - r.left - ox) / k, (cy - r.top - oy) / k, k];
  }
  function hit(d, x, y, k) {
    const extra = Math.max(PAD, (MIN_PX / k - Math.min(d.w, d.h)) / 2);
    return x >= d.x - extra && x <= d.x + d.w + extra && y >= d.y - extra && y <= d.y + d.h + extra;
  }
  function placeMark(pic, d, cls) {
    const r = pic.getBoundingClientRect(), k = scaleOf(pic);
    const ox = (r.width - VW * k) / 2, oy = (r.height - VH * k) / 2;
    const size = Math.max(MIN_PX, Math.max(d.w, d.h) * k + 14);
    const el = document.createElement('div');
    el.className = 'mark' + (cls ? ' ' + cls : '');
    el.dataset.key = d.key;
    Object.assign(el.style, { width: size + 'px', height: size + 'px',
      left: (ox + (d.x + d.w / 2) * k - size / 2) + 'px', top: (oy + (d.y + d.h / 2) * k - size / 2) + 'px' });
    pic.appendChild(el);
  }
  function onTap(pic, e) {
    const [x, y, k] = toScene(pic, e.clientX, e.clientY);
    const d = DIFFS.find(dd => !found.has(dd.key) && hit(dd, x, y, k));
    if (d) {
      found.add(d.key);
      document.querySelectorAll(`.mark.hint[data-key="${d.key}"]`).forEach(m => m.remove());
      [picA, picB].forEach(p => placeMark(p, d));
      document.getElementById('found').textContent = found.size;
      if (found.size === DIFFS.length) setTimeout(() => { document.getElementById('done').style.display = 'flex'; }, 500);
    } else if (!DIFFS.some(dd => found.has(dd.key) && hit(dd, x, y, k))) {
      const m = document.createElement('div');
      m.className = 'miss'; m.textContent = '✕';
      const r = pic.getBoundingClientRect();
      m.style.left = (e.clientX - r.left) + 'px'; m.style.top = (e.clientY - r.top) + 'px';
      pic.appendChild(m); setTimeout(() => m.remove(), 700);
    }
  }
  [picA, picB].forEach(p => p.addEventListener('click', e => onTap(p, e)));
  document.getElementById('btn-hint').onclick = () => {
    const d = DIFFS.find(dd => !found.has(dd.key));
    if (d && !document.querySelector(`.mark.hint[data-key="${d.key}"]`)) placeMark(picB, d, 'hint');
  };
  document.getElementById('btn-answer').onclick = () => {
    document.querySelectorAll('.mark.answer').forEach(m => m.remove());
    DIFFS.filter(d => !found.has(d.key)).forEach(d => [picA, picB].forEach(p => placeMark(p, d, 'answer')));
  };
  document.getElementById('btn-reset').onclick = () => location.reload();
  document.getElementById('done').onclick = e => { e.currentTarget.style.display = 'none'; };
  window.__DIFFS = DIFFS; // 개발 확인용
})();
</script>
</body>
</html>
