<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f5e46">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 홈 화면에 설치될 앱 이름 (게임 화면 제목과 별개로 앱 전체 이름) -->
  <meta name="application-name" content="엄마 게임천국">
  <meta name="apple-mobile-web-app-title" content="엄마 게임천국">
  <title>타일 매치</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png?v=32">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png?v=32">
  <link rel="stylesheet" href="style.css?v=32">
</head>
<body>
  <div id="app">
    <section id="home" class="screen">
      <button id="btn-hub" class="hub-back">← 게임 목록</button>
      <div class="home-inner">
        <div class="logo">
          <div class="logo-tile">🍓</div><div class="logo-tile">🍓</div><div class="logo-tile">🍓</div>
        </div>
        <h1>타일 매치</h1>
        <p class="sub">같은 그림 3개를 모으면 사라져요</p>
        <button id="btn-continue" class="btn big">이어하기<small id="continue-sub">레벨 1</small></button>
        <button id="btn-new" class="btn light">새 게임</button>
        <button id="btn-stages" class="btn light">스테이지 선택</button>
        <button id="btn-sound-home" class="btn light small">🔊 소리 켜짐</button>
        <p id="app-version" class="version"></p>
      </div>
    </section>

    <section id="stages" class="screen hidden">
      <header class="topbar">
        <button id="btn-stages-back" class="icon-btn" aria-label="뒤로">←</button>
        <div class="screen-title">스테이지 선택</div>
        <div class="topbar-spacer"></div>
      </header>
      <div id="stage-grid"></div>
      <div class="pager">
        <button id="pg-prev" class="icon-btn" aria-label="이전">◀</button>
        <span id="pg-label">1 – 20</span>
        <button id="pg-next" class="icon-btn" aria-label="다음">▶</button>
      </div>
      <p class="legend"><span class="lg cleared">✓</span> 클리어 <span class="lg current">▶</span> 도전 <span class="lg locked">🔒</span> 잠김</p>
    </section>

    <section id="game" class="screen hidden">
      <header class="topbar">
        <button id="btn-home" class="icon-btn" aria-label="홈">🏠</button>
        <div id="level-label">레벨 1</div>
        <button id="btn-sound" class="icon-btn" aria-label="소리">🔊</button>
        <button id="btn-restart" class="icon-btn" aria-label="다시 하기">↻</button>
      </header>
      <div id="tip"></div>
      <div id="board-area"></div>
      <div id="slot-bar">
        <div class="slot-cell"></div><div class="slot-cell"></div><div class="slot-cell"></div>
        <div class="slot-cell"></div><div class="slot-cell"></div><div class="slot-cell"></div>
        <div class="slot-cell"></div>
      </div>
      <div id="boosters">
        <button class="booster" id="b-undo"><span class="b-ico">↶</span><span class="b-name">되돌리기</span><span class="b-count">3</span></button>
        <button class="booster" id="b-shuffle"><span class="b-ico">🔀</span><span class="b-name">섞기</span><span class="b-count">2</span></button>
        <button class="booster" id="b-hint"><span class="b-ico">💡</span><span class="b-name">힌트</span><span class="b-count">3</span></button>
      </div>
      <div id="tiles"></div>
    </section>

    <div id="overlay" class="hidden">
      <div class="modal">
        <div class="modal-emoji"></div>
        <h2 class="modal-title"></h2>
        <p class="modal-text"></p>
        <div class="modal-btns"></div>
      </div>
    </div>
    <div id="toast" class="hidden"></div>
  </div>
  <script src="../../wallet.js?v=32"></script>
  <script src="levels.js?v=32"></script>
  <script src="game.js?v=32"></script>
</body>
</html>
