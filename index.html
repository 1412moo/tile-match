<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f5e46">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 홈 화면에 설치될 앱 이름 (게임 화면 제목과 별개로 앱 전체 이름) -->
  <meta name="application-name" content="엄마 게임천국">
  <meta name="apple-mobile-web-app-title" content="엄마 게임천국">
  <title>엄마 게임천국</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png?v=32">
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=32">
  <link rel="stylesheet" href="hub.css?v=32">
</head>
<body>
  <main id="hub">
    <header class="hub-head">
      <h1><span class="hub-logo">🎮</span> 엄마 게임천국</h1>
      <p class="hub-sub">하고 싶은 게임을 눌러 주세요</p>
    </header>
    <button id="wallet-bar" class="wallet-bar" aria-label="내 게임머니와 오늘의 미션">
      <span class="wb-money" id="wb-money"></span>
      <span class="wb-mission">📋 오늘의 미션<b id="wb-count" class="wb-count hidden"></b></span>
    </button>
    <nav id="game-list" aria-label="게임 목록"></nav>
    <p id="hub-version" class="hub-version"></p>
  </main>
  <div id="toast" class="hidden"></div>
  <!-- 오늘의 미션 (wallet.js) -->
  <div id="missions" class="sheet hidden" role="dialog" aria-label="오늘의 미션">
    <div class="sheet-box">
      <div class="sheet-head"><b>📋 오늘의 미션</b><button id="missions-close" class="sheet-x" aria-label="닫기">✕</button></div>
      <p class="sheet-sub" id="missions-sub"></p>
      <div id="mission-list" class="mission-list"></div>
    </div>
  </div>
  <script src="wallet.js?v=32"></script>
  <script src="games/registry.js?v=32"></script>
  <script src="hub.js?v=32"></script>
</body>
</html>
